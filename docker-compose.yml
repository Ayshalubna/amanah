services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

  api:
    build: .
    environment:
      AMANAH_LLM: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
    ports: ["8000:8000"]
    depends_on: [ollama]

  dashboard:
    build: .
    command: streamlit run app/dashboard.py --server.address 0.0.0.0 --server.port 8501
    environment:
      AMANAH_LLM: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
    ports: ["8501:8501"]
    depends_on: [ollama]

volumes:
  ollama:
